name: Bug report
description: Report a reproducible problem in the simulator.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove credentials, private URLs, and personal data before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest reliable sequence of steps.
      placeholder: |-
        1. Start the application with ...
        2. Open ...
        3. Submit ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste redacted logs only. Never include secrets.
      render: text
